    /* === POPUP PERSONALIZZABILE === */
    #borgoPopupOverlay[hidden],#borgoPopupAnimation[hidden]{display:none!important}
    #borgoPopupOverlay{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.72);font-family:Arial,sans-serif}
    #borgoPopup{position:relative;width:min(560px,100%);max-height:calc(100vh - 36px);overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.45);animation:borgoPopupIn .3s ease both}

    #borgoPopupTitle{margin:0 44px 12px 0;font-size:26px;line-height:1.2}
    #borgoPopupText{font-size:16px;line-height:1.55}
    #borgoPopupCloseTop{position:absolute;right:10px;top:10px;width:42px;height:42px;border:0;border-radius:50%;font-size:28px;line-height:1;cursor:pointer;background:rgba(255,255,255,.94);z-index:2}
    #borgoPopupButtons{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
    .borgoPopupBtn{min-height:44px;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
    #borgoPopupHelp{width:46px;padding:0;font-size:21px;background:#e9e9e9}
    #borgoPopupContinue{background:#222;color:#fff}
    #borgoPopupClose{background:#e9e9e9;color:#222}
    #borgoPopupAnimation{position:fixed;inset:0;z-index:2147483001;pointer-events:none;overflow:hidden}
    #borgoFlyingImg{position:absolute;left:-220px;top:50%;width:min(190px,32vw);max-height:190px;object-fit:contain;transform:translateY(-50%);animation:borgoFlyAcross 2.8s linear both}
    @keyframes borgoPopupIn{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes borgoFlyAcross{from{left:-220px;transform:translateY(-50%) rotate(-8deg)}to{left:calc(100vw + 220px);transform:translateY(-50%) rotate(8deg)}}
    @media(max-width:560px){#borgoPopupButtons{flex-wrap:wrap}.borgoPopupBtn:not(#borgoPopupHelp){flex:1}}
    </style>
